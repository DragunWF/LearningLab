<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcane Counter (For Learning)</title>
    <style>
      /* 
      ARCANE TECH AESTHETIC
      Theme: Dark Slate Background, Glassmorphism, Emerald Accents.
    */
      :root {
        --bg-color: #0f172a; /* Dark Slate */
        --accent-color: #10b981; /* Emerald Green */
        --text-color: #f8fafc;
        --glass-bg: rgba(30, 41, 59, 0.7);
        --glow-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
      }

      body {
        width: 300px;
        height: 400px;
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      #app-container {
        width: 80%;
        height: 80%;
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        padding: 20px;
        text-align: center;
      }

      h1 {
        font-size: 1.2rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--accent-color);
        margin-bottom: 20px;
        text-shadow: var(--glow-shadow);
      }

      #counter-display {
        font-size: 4rem;
        font-weight: 800;
        margin: 20px 0;
        font-family: "Courier New", Courier, monospace;
        color: #fff;
        text-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
      }

      .btn {
        background: transparent;
        border: 2px solid var(--accent-color);
        color: var(--accent-color);
        padding: 10px 30px;
        font-size: 1rem;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        outline: none;
      }

      .btn:hover {
        background: var(--accent-color);
        color: var(--bg-color);
        box-shadow: var(--glow-shadow);
        transform: translateY(-2px);
      }

      .btn:active {
        transform: translateY(0);
      }

      .status-text {
        font-size: 0.7rem;
        margin-top: 15px;
        opacity: 0.6;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div id="app-container">
      <h1>Arcane Node</h1>
      <div id="counter-display">0</div>
      <button id="increment-btn" class="btn">Summon</button>
      <div class="status-text">Synchronizing with Aether...</div>
    </div>
    <!-- Entry point for logic -->
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
